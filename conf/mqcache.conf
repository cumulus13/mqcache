# mqcache.conf - MQCache server configuration (redis.conf style)
# Syntax: <directive> <value> [value...]   Lines starting with # are comments. Use "double quotes" for values with spaces.
# Every directive can also be overridden on the command line:  mqcache-server mqcache.conf --workers 8

################################## MSMQ ##################################

# Request queue (private queue on this machine). Clients address it as "<host>/mqcache".
queue                    private$\mqcache

# yes  = transactional queue: exactly-once receive, requests are redelivered if processing fails (recommended).
# no   = non-transactional: faster, but a request is lost if the server crashes mid-processing.
# NOTE: MSMQ cannot change this on an existing queue. Delete the queue first if you change it.
queue-transactional      yes

# Keep a copy of every consumed request in the queue's journal (audit/replay). Grows unbounded unless capped.
queue-journal            no
# Cap for the journal / the queue itself in KB (0 = MSMQ default). Pair with queue-journal.
queue-journal-max-kb     0
queue-max-size-kb        0

# Queue-level security. Authenticate/encryption need MSMQ in Active Directory mode (domain). Leave off in workgroup mode.
queue-authenticate       no
queue-encryption         none          # none | optional | body

# Accounts granted SEND rights / FULL CONTROL on the request queue (repeatable). Empty = MSMQ defaults.
# queue-allow            "DOMAIN\cache-clients"
# queue-admin            "DOMAIN\cache-admins"

# Parallel receive loops. 1 = strict global ordering of requests. Store operations are serialized internally anyway.
workers                  4
receive-timeout-ms       1000

# Replies are discarded by MSMQ if the client does not pick them up in time (prevents reply-queue growth).
reply-ttl-seconds        60
reply-recoverable        no

# Requests that keep failing (bugs, undecodable messages) are parked here after N attempts. See: POISON COUNT|PEEK|REQUEUE|PURGE
poison-queue             private$\mqcache.poison
poison-max-attempts      3

# A request id seen again within this window returns the original answer instead of re-executing
# (protects INCR/APPEND/LPUSH against client retries and MSMQ redelivery). 0 disables.
dedupe-window-seconds    60
dedupe-max-entries       100000

################################## STORE #################################

# Memory limit for stored data (0 = unlimited). Sizes: 64kb, 512mb, 2gb.
maxmemory                0
# noeviction | allkeys-lru | volatile-lru | volatile-ttl
maxmemory-policy         noeviction

# MSMQ messages are limited to 4 MiB, so values are limited too (hard maximum 3670016).
max-value-bytes          1048576
max-batch-commands       1000
keys-max-results         10000
active-expire-interval-ms 100

################################ SECURITY ################################

# Clients must send this password with every request ("" = disabled). Use encryption/ACLs too: MSMQ messages are plain text on the wire.
# requirepass            "change-me"

############################### PERSISTENCE ##############################

dir                      ./data
dbfilename               dump.mqdb
# Snapshot when <seconds> elapsed AND <changes> happened. Use  save ""  to disable snapshots entirely.
save                     900 1
save                     300 100
save                     60 10000
save-on-shutdown         yes

################################ PUB / SUB ###############################

# Subscriber leases expire unless renewed (clients renew automatically every ~30s).
pubsub-subscription-ttl-seconds 120
# Also publish this channel to an MSMQ multicast group (PGM; needs the MSMQ Multicast feature). Repeatable.
# multicast-channel      news 234.1.1.1:8001

################################ LOGGING #################################

loglevel                 info          # debug | info | warn | error
# logfile                C:\ProgramData\MQCache\logs\mqcache.log   (daily rolling; default when running as a service: .\logs)
