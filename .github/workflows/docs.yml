---
name: Docs

on:
  push:
    branches: [master]
    paths: ['docs/**', 'README.md', 'conf/**', '.github/actions/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pandoc
      - name: Build all formats
        shell: pwsh
        run: ./docs/build-docs.ps1 -Version main-${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: mqcache-docs
          path: dist/docs/**
          retention-days: 30
