name: Python SDK

on:
  push:
    branches: [main, master]
    paths: ['sdk/**', 'src/MQCache.Core/Protocol/**', '.github/workflows/python-sdk.yml']
    tags: ['python-v*']
  pull_request:
    paths: ['sdk/**', 'src/MQCache.Core/Protocol/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e "sdk/python[test]"
      - name: Test (codec golden vectors + client logic; COM integration tests skip themselves)
        working-directory: sdk/python
        run: python -m pytest -q

  golden-in-sync:
    name: Golden vectors match the .NET codec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Regenerate and compare
        run: |
          dotnet run --project sdk/tools/GoldenVectors -c Release -- "$RUNNER_TEMP/golden.json"
          diff -u sdk/testdata/golden.json "$RUNNER_TEMP/golden.json"

  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    needs: [test, golden-in-sync]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build sdk/python
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: sdk/python/dist/*

  publish:
    name: Publish to PyPI (trusted publishing)
    if: startsWith(github.ref, 'refs/tags/python-v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
